    mem_reservation: ${AIRBAR_FLYTODAY_COLLECTOR_MEMORY_RESERVATION:-128m}
    pids_limit: ${AIRBAR_FLYTODAY_COLLECTOR_PIDS:-128}
networks:
  torob-net:
    name: ${TOROB_NETWORK_NAME:-torob-net}
    external: ${TOROB_NETWORK_EXTERNAL:-true}

    cpus: ${AIRBAR_TRIP_COLLECTOR_CPUS:-0.15}
    mem_limit: ${AIRBAR_TRIP_COLLECTOR_MEMORY:-256m}
    mem_reservation: ${AIRBAR_TRIP_COLLECTOR_MEMORY_RESERVATION:-128m}
    pids_limit: ${AIRBAR_TRIP_COLLECTOR_PIDS:-128}
  flight-services-flytoday-collector:
    <<: *flight-common
    build:
      context: .
      dockerfile: services/collectors/flytoday/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://flight:flight@postgres:5432/flight_services?sslmode=disable}
      MIGRATIONS_PATH: /app/migrations/001_flights_core.sql
      MULTI_COLLECTOR_MIGRATION_PATH: /app/migrations/002_multi_collector.sql
      MAX_WORKERS: ${FLYTODAY_MAX_WORKERS:-1}
      RATE_LIMIT_RPS: ${FLYTODAY_RATE_LIMIT_RPS:-0.02}
      RATE_LIMIT_BURST: ${FLYTODAY_RATE_LIMIT_BURST:-1}
      COLLECT_JOB_SPACING: ${FLYTODAY_COLLECT_JOB_SPACING:-15s}
      POLL_INTERVAL: ${FLYTODAY_POLL_INTERVAL:-8s}
      SEED_INTERVAL: ${FLYTODAY_SEED_INTERVAL:-5m}
      JOB_STALE_AFTER: ${FLYTODAY_JOB_STALE_AFTER:-15m}
      HTTP_TIMEOUT: ${FLYTODAY_HTTP_TIMEOUT:-90s}
      CIRCUIT_BREAKER_THRESHOLD: ${FLYTODAY_CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_OPEN: ${FLYTODAY_CIRCUIT_BREAKER_OPEN:-10m}
      FLYTODAY_MAX_POLLS: ${FLYTODAY_MAX_POLLS:-8}
      FLYTODAY_BASE_URL: ${FLYTODAY_BASE_URL:-https://www.flytoday.ir/api/gateway/V1}
      FLYTODAY_REFERER: ${FLYTODAY_REFERER:-https://www.flytoday.ir}
      FLYTODAY_ORIGIN_HEADER: ${FLYTODAY_ORIGIN_HEADER:-https://www.flytoday.ir}
      FLYTODAY_REQUEST_SOURCE: ${FLYTODAY_REQUEST_SOURCE:-www.flytoday.ir}

name: torob-ranker
services:
  ranker:
    build: .
    environment:
      RANKER_DATABASE_URL: ${RANKER_DATABASE_URL:-postgres://ranker:ranker@torob-postgres:5432/ranker_db?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://torob:torob@torob-rabbitmq:5672/}
      RANKER_RABBITMQ_EXCHANGE: ${RANKER_RABBITMQ_EXCHANGE:-torob.flights}
      RANKER_RABBITMQ_QUEUE: ${RANKER_RABBITMQ_QUEUE:-torob.ranker}
      RANKER_RABBITMQ_ROUTING_KEY: ${RANKER_RABBITMQ_ROUTING_KEY:-flight.upsert}
      RANKER_INTERVAL: ${RANKER_INTERVAL:-10s}
      HTTP_ADDR: :8081
    ports: ["${RANKER_API_PORT:-8081}:8081"]
    networks: [torob-net]
    restart: unless-stopped
networks:
  torob-net:
    name: ${TOROB_NETWORK_NAME:-torob-net}
    external: ${TOROB_NETWORK_EXTERNAL:-true}
